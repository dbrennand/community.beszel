---
name: CI

on:
  pull_request:
  # Run CI once per day (at 07:30 UTC)
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      envlist: ${{ steps.matrix.outputs.envlist }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: "true"

      - name: Generate matrix
        id: matrix
        run: |
          uv run --no-dev --group test tox --ansible --gh-matrix

  tox-ansible:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.generate-matrix.outputs.envlist) }}
    steps:
      - name: Set up Docker Compose
        if: contains(matrix.entry.name, 'molecule')
        uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6 # v2.1.0

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: "true"

      - name: Run tox environment ${{ matrix.entry.name }}
        run: |
          uv run --no-dev --group test tox --ansible -e ${{ matrix.entry.name }}

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: "true"

      - name: Run ansible-lint
        run: |
          uv run --no-dev --group test ansible-lint -v
