[ansible]
skip =
    2.16

[testenv:ruff]
skip_install = true
commands =
    uv run --active ruff format .

[testenv:yamllint]
skip_install = true
commands =
    uv run --active yamllint -c .yamllint .

[testenv:flake8]
skip_install = true
commands =
    uv run --active flake8 --config flake8.ini

[testenv]
commands_pre =
    integration: bash -c "ade install --requirement extensions/molecule/requirements.yml --no-seed --im none"
commands =
    unit: uv pip install pytest-cov
    unit: python3 -m pytest --cov --cov-config=.coveragerc --ansible-unit-inject-only ./tests/unit
